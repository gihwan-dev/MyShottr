name: MyShottr
options:
  bundleIdPrefix: com.myshottr
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MyShottr:
    type: application
    platform: macOS
    sources:
      - Sources/MyShottrApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Config/MyShottr-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: MyShottr captures a screen region that you explicitly select.
        CFBundleDocumentTypes:
          - CFBundleTypeName: MyShottr Project
            CFBundleTypeExtensions: [myshottr]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.myshottr.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.myshottr.project
            UTTypeConformsTo: [com.apple.package]
            UTTypeDescription: MyShottr Project
            UTTypeTagSpecification:
              public.filename-extension: [myshottr]
    entitlements:
      path: Config/MyShottr.entitlements
    preBuildScripts:
      - name: Build Local Editor
        script: Scripts/build-editor.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myshottr.app
        PRODUCT_NAME: MyShottr
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MyShottrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MyShottrTests
      - path: Tests/Fixtures/source-2x.png
        buildPhase: resources
    dependencies:
      - target: MyShottr
schemes:
  MyShottr:
    build:
      targets:
        MyShottr: all
        MyShottrTests: [test]
    test:
      targets:
        - MyShottrTests
