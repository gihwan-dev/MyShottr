name: Inkbeam
options:
  bundleIdPrefix: dev.gihwan
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: SLVS4WF9U2
targets:
  Inkbeam:
    type: application
    platform: macOS
    dependencies:
      - target: InkbeamNativeHost
        embed: false
        link: false
    sources:
      - Sources/InkbeamApp
      - Sources/InkbeamShared
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Config/chrome-extension-key.b64
        buildPhase: resources
    resources:
      - path: Resources/Assets.xcassets
      - path: Config/chrome-extension-key.b64
    info:
      path: Config/Inkbeam-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSMultipleInstancesProhibited: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Inkbeam captures a screen region that you explicitly select.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Inkbeam Project
            CFBundleTypeExtensions: [inkbeam]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.gihwan.inkbeam.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.gihwan.inkbeam.project
            UTTypeConformsTo: [com.apple.package]
            UTTypeDescription: Inkbeam Project
            UTTypeTagSpecification:
              public.filename-extension: [inkbeam]
    entitlements:
      path: Config/Inkbeam.entitlements
    preBuildScripts:
      - name: Build Local Editor
        script: Scripts/build-editor.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed Native Messaging Host
        script: |
          set -euo pipefail
          DESTINATION="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${DESTINATION}"
          cp "${BUILT_PRODUCTS_DIR}/InkbeamNativeHost" \
            "${DESTINATION}/InkbeamNativeHost"
          chmod 0755 "${DESTINATION}/InkbeamNativeHost"
        basedOnDependencyAnalysis: false
    settings:
      base:
        MARKETING_VERSION: "0.2.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.gihwan.inkbeam
        PRODUCT_NAME: Inkbeam
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  InkbeamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InkbeamTests
      - path: Tests/Fixtures/source-2x.png
        buildPhase: resources
      - path: Config/chrome-extension-key.b64
        buildPhase: resources
    dependencies:
      - target: Inkbeam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  InkbeamNativeHost:
    type: tool
    platform: macOS
    sources:
      - Sources/InkbeamNativeHost
      - Sources/InkbeamShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gihwan.inkbeam.nativehost
  InkbeamNativeHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InkbeamNativeHostTests
      - path: Sources/InkbeamNativeHost
        excludes:
          - main.swift
      - Sources/InkbeamShared
    dependencies:
      - target: InkbeamNativeHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Inkbeam:
    build:
      targets:
        Inkbeam: all
        InkbeamTests: [test]
    test:
      targets:
        - InkbeamTests
  InkbeamNativeHost:
    build:
      targets:
        InkbeamNativeHost: all
        InkbeamNativeHostTests: [test]
    test:
      targets:
        - InkbeamNativeHostTests
